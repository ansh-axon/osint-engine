<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON // Cyber Defense & Data Analytics Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- High-Performance Data Streaming & Charting Engines -->
  <script src="/js/papaparse.min.js"></script>
  <script src="/js/chart.min.js"></script>
  <script src="/js/xlsx.full.min.js"></script>
  <!-- Google Fonts: Orbitron & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #05070d;
      color: #e2e8f0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    body.theme-cyberpunk {
      background-color: #05070d;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
        radial-gradient(circle at 100% 50%, rgba(255, 0, 128, 0.05), transparent 40%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }
    body.theme-obsidian {
      background-color: #0d1117;
      background-image: none;
      color: #e6edf3;
    }
    body.theme-obsidian .cyber-card {
      background: #161b22;
      border: 1px solid #30363d;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    body.theme-obsidian .neon-cyan {
      color: #58a6ff;
      text-shadow: none;
    }
    body.theme-obsidian .neon-green {
      color: #3fb950;
      text-shadow: none;
    }
    body.theme-obsidian .neon-pink {
      color: #f778ba;
      text-shadow: none;
    }
    body.theme-obsidian .cyber-btn {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(35, 134, 54, 0.3);
    }
    body.theme-obsidian .cyber-btn:hover {
      background: #2ea043;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(46, 160, 67, 0.5);
    }
    body.theme-midnight {
      background-color: #080e1a;
      background-image: radial-gradient(circle at 50% 10%, rgba(30, 58, 138, 0.25), transparent 60%);
      color: #cbd5e1;
    }
    body.theme-midnight .cyber-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    body.theme-matrix {
      background-color: #000000;
      background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #10b981;
    }
    body.theme-matrix .cyber-card {
      background: rgba(3, 15, 8, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    body.theme-matrix .neon-cyan, body.theme-matrix .neon-pink {
      color: #10b981;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .neon-cyan {
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6), 0 0 24px rgba(0, 240, 255, 0.3);
    }
    .neon-green {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }
    .neon-pink {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }
    .cyber-card {
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.03);
    }
    .cyber-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.06);
    }
    .cyber-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(255, 0, 127, 0.15));
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
    }
    .cyber-btn:hover {
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }
    #cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(255, 0, 127, 0.04) 50%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    #cyber-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #06080e; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <div id="cursor-glow"></div>
  <canvas id="cyber-canvas"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation state: 'analytics', 'cybersecurity', 'recon'
      const [currentView, setCurrentView] = useState('analytics');
      
      // 2FA Authenticator States
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [totpCode, setTotpCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [showSecretKey, setShowSecretKey] = useState(false);

      // OSINT Recon States
      const [target, setTarget] = useState('github.com');
      const [scanning, setScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('subdomains');
      const [searchFilter, setSearchFilter] = useState('');
      const [dnsData, setDnsData] = useState(null);
      const [subdomainsData, setSubdomainsData] = useState(null);
      const [whoisData, setWhoisData] = useState(null);
      const [headersData, setHeadersData] = useState(null);

      // Display & Theme States (Customizable UI)
      const [activeTheme, setActiveTheme] = useState('cyberpunk');
      const [particlesEnabled, setParticlesEnabled] = useState(true);

      // High-Throughput Big Data & Streaming States
      const [isProcessingBigData, setIsProcessingBigData] = useState(false);
      const [progressStats, setProgressStats] = useState(null);
      const [analyzedReport, setAnalyzedReport] = useState(null);
      const [selectedChartCol, setSelectedChartCol] = useState('');
      const [previewSearch, setPreviewSearch] = useState('');
      const [previewPage, setPreviewPage] = useState(1);
      const [dragOver, setDragOver] = useState(false);
      const [rawInputData, setRawInputData] = useState('');

      // Dynamic Visual Studio Customizer States
      const [chartType1, setChartType1] = useState('bar'); // 'bar', 'horizontalBar', 'line', 'radar'
      const [chartType2, setChartType2] = useState('doughnut'); // 'doughnut', 'pie', 'polarArea'
      const [metricMode, setMetricMode] = useState('COUNT'); // 'COUNT', 'SUM', 'AVG', 'MAX', 'MIN'
      const [metricField, setMetricField] = useState(''); // Target numerical column
      const [chartSortOrder, setChartSortOrder] = useState('DESC'); // 'DESC', 'ASC', 'NATURAL'
      const [chartPalette, setChartPalette] = useState('cyber'); // 'cyber', 'emerald', 'amber', 'purple'

      // Apply theme & particle effects to body
      useEffect(() => {
        document.body.className = `theme-${activeTheme}`;
        const canvas = document.getElementById('cyber-canvas');
        const glow = document.getElementById('cursor-glow');
        const showFX = particlesEnabled && activeTheme === 'cyberpunk';
        if (canvas) canvas.style.display = showFX ? 'block' : 'none';
        if (glow) glow.style.display = showFX ? 'block' : 'none';
      }, [activeTheme, particlesEnabled]);

      // Dynamic Aggregation Helper for any dimension & metric
      const computeAggregatedData = () => {
        if (!analyzedReport) return { labels: [], values: [], metricTitle: '' };

        const dim = selectedChartCol || (analyzedReport.columns[0] ? analyzedReport.columns[0].name : '');
        const dimCol = analyzedReport.columns.find(c => c.name === dim);
        if (!dimCol) return { labels: [], values: [], metricTitle: '' };

        let metricTitle = `${dim} (Frequency Count)`;
        if (metricMode !== 'COUNT' && metricField) {
          metricTitle = `${metricMode} of ${metricField} by ${dim}`;
        }

        // Check if pre-aggregated 1M benchmark crossMetrics exist
        if (analyzedReport.crossMetrics && metricMode !== 'COUNT' && metricField && analyzedReport.crossMetrics[dim] && analyzedReport.crossMetrics[dim][metricField]) {
          const map = analyzedReport.crossMetrics[dim][metricField];
          let entries = Object.keys(map).map(k => {
            let val = map[k];
            if (metricMode === 'AVG') {
              const count = dimCol.frequencies ? dimCol.frequencies[k] || 1 : 1;
              val = Math.round((val / count) * 100) / 100;
            } else {
              val = Math.round(val * 100) / 100;
            }
            return { label: k, value: val };
          });

          if (chartSortOrder === 'DESC') entries.sort((a, b) => b.value - a.value);
          else if (chartSortOrder === 'ASC') entries.sort((a, b) => a.value - b.value);

          return {
            labels: entries.map(e => e.label),
            values: entries.map(e => e.value),
            metricTitle
          };
        }

        // If simple Frequency Count
        if (metricMode === 'COUNT' || !metricField) {
          const freq = dimCol.frequencies || {};
          let entries = Object.keys(freq).map(k => ({ label: k, value: freq[k] }));

          if (chartSortOrder === 'DESC') entries.sort((a, b) => b.value - a.value);
          else if (chartSortOrder === 'ASC') entries.sort((a, b) => a.value - b.value);

          return {
            labels: entries.map(e => e.label),
            values: entries.map(e => e.value),
            metricTitle
          };
        }

        // Compute on previewRows or dataset rows
        const rows = analyzedReport.previewRows || [];
        const groups = {};
        rows.forEach(r => {
          const key = String(r[dim] !== undefined ? r[dim] : 'Other').trim() || 'Missing';
          if (!groups[key]) groups[key] = { count: 0, sum: 0, min: Infinity, max: -Infinity };
          groups[key].count++;
          const raw = String(r[metricField] !== undefined ? r[metricField] : '').replace(/[^0-9.-]+/g, '');
          const num = Number(raw);
          if (!isNaN(num) && raw !== '') {
            groups[key].sum += num;
            if (num < groups[key].min) groups[key].min = num;
            if (num > groups[key].max) groups[key].max = num;
          }
        });

        let entries = Object.keys(groups).map(k => {
          const g = groups[k];
          let val = g.count;
          if (metricMode === 'SUM') val = Math.round(g.sum * 100) / 100;
          else if (metricMode === 'AVG') val = g.count ? Math.round((g.sum / g.count) * 100) / 100 : 0;
          else if (metricMode === 'MAX') val = g.max === -Infinity ? 0 : g.max;
          else if (metricMode === 'MIN') val = g.min === Infinity ? 0 : g.min;
          return { label: k, value: val };
        });

        if (chartSortOrder === 'DESC') entries.sort((a, b) => b.value - a.value);
        else if (chartSortOrder === 'ASC') entries.sort((a, b) => a.value - b.value);

        return {
          labels: entries.map(e => e.label),
          values: entries.map(e => e.value),
          metricTitle
        };
      };

      // Chart.js Live Synchronization Hook with Full Customization
      useEffect(() => {
        if (!analyzedReport || !window.Chart) return;

        const { labels, values, metricTitle } = computeAggregatedData();
        if (!labels.length) return;

        const paletteDefs = {
          cyber: {
            primary: '#00f0ff',
            border: '#00f0ff',
            bg: 'rgba(0, 240, 255, 0.45)',
            hoverBg: 'rgba(255, 0, 127, 0.65)',
            hoverBorder: '#ff007f',
            colors: ['#00f0ff', '#ff007f', '#00ff88', '#facc15', '#a855f7', '#38bdf8']
          },
          emerald: {
            primary: '#10b981',
            border: '#10b981',
            bg: 'rgba(16, 185, 129, 0.45)',
            hoverBg: 'rgba(52, 211, 153, 0.7)',
            hoverBorder: '#34d399',
            colors: ['#10b981', '#34d399', '#059669', '#6ee7b7', '#047857', '#a7f3d0']
          },
          amber: {
            primary: '#f59e0b',
            border: '#f59e0b',
            bg: 'rgba(245, 158, 11, 0.45)',
            hoverBg: 'rgba(239, 68, 68, 0.7)',
            hoverBorder: '#ef4444',
            colors: ['#f59e0b', '#ef4444', '#f97316', '#fbbf24', '#e11d48', '#facc15']
          },
          purple: {
            primary: '#a855f7',
            border: '#a855f7',
            bg: 'rgba(168, 85, 247, 0.45)',
            hoverBg: 'rgba(99, 102, 241, 0.7)',
            hoverBorder: '#6366f1',
            colors: ['#a855f7', '#6366f1', '#ec4899', '#3b82f6', '#8b5cf6', '#d946ef']
          }
        };

        const pal = paletteDefs[chartPalette] || paletteDefs.cyber;

        // 1. Main Distribution Chart
        const canvas1 = document.getElementById('chart-distribution');
        if (canvas1) {
          if (window.distChartInstance) {
            window.distChartInstance.destroy();
            window.distChartInstance = null;
          }

          const topLabels = labels.slice(0, 10);
          const topValues = values.slice(0, 10);

          const isHorizontal = chartType1 === 'horizontalBar';
          const isLine = chartType1 === 'line';
          const isRadar = chartType1 === 'radar';

          window.distChartInstance = new Chart(canvas1, {
            type: (isHorizontal || chartType1 === 'bar') ? 'bar' : chartType1,
            data: {
              labels: topLabels,
              datasets: [{
                label: metricTitle,
                data: topValues,
                backgroundColor: isLine ? 'rgba(0, 240, 255, 0.15)' : pal.bg,
                borderColor: pal.border,
                borderWidth: isLine ? 2.5 : 1.5,
                borderRadius: isHorizontal || chartType1 === 'bar' ? 6 : 0,
                fill: isLine || isRadar,
                tension: 0.35,
                pointBackgroundColor: pal.primary,
                pointRadius: isLine ? 4 : 0,
                hoverBackgroundColor: pal.hoverBg,
                hoverBorderColor: pal.hoverBorder
              }]
            },
            options: {
              indexAxis: isHorizontal ? 'y' : 'x',
              responsive: true,
              maintainAspectRatio: false,
              animation: { duration: 400 },
              plugins: {
                legend: {
                  labels: { color: pal.primary, font: { family: 'Orbitron', size: 10 } }
                },
                tooltip: {
                  backgroundColor: 'rgba(6, 10, 20, 0.95)',
                  borderColor: pal.border,
                  borderWidth: 1,
                  titleColor: pal.primary,
                  bodyColor: '#ffffff',
                  bodyFont: { family: 'JetBrains Mono', size: 11 }
                }
              },
              scales: isRadar ? {} : {
                x: {
                  ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 9 }, maxRotation: 30 },
                  grid: { color: 'rgba(255, 255, 255, 0.05)' }
                },
                y: {
                  ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 9 } },
                  grid: { color: 'rgba(255, 255, 255, 0.05)' }
                }
              }
            }
          });
        }

        // 2. Proportion & Share Chart
        const canvas2 = document.getElementById('chart-proportion');
        if (canvas2) {
          if (window.propChartInstance) {
            window.propChartInstance.destroy();
            window.propChartInstance = null;
          }

          const topLabels = labels.slice(0, 6);
          const topValues = values.slice(0, 6);

          window.propChartInstance = new Chart(canvas2, {
            type: chartType2,
            data: {
              labels: topLabels,
              datasets: [{
                data: topValues,
                backgroundColor: pal.colors.slice(0, topLabels.length),
                borderColor: activeTheme === 'obsidian' ? '#161b22' : '#05070d',
                borderWidth: 2,
                hoverOffset: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: { duration: 400 },
              plugins: {
                legend: {
                  position: 'right',
                  labels: { color: '#e2e8f0', font: { family: 'JetBrains Mono', size: 10 }, boxWidth: 10 }
                },
                tooltip: {
                  backgroundColor: 'rgba(6, 10, 20, 0.95)',
                  borderColor: pal.hoverBorder,
                  borderWidth: 1,
                  titleColor: pal.hoverBorder,
                  bodyColor: '#ffffff',
                  bodyFont: { family: 'JetBrains Mono', size: 11 }
                }
              }
            }
          });
        }
      }, [analyzedReport, selectedChartCol, chartType1, chartType2, metricMode, metricField, chartSortOrder, chartPalette, activeTheme]);

      // 10 LAKH (1,000,000) ROWS HIGH-THROUGHPUT WEB WORKER SYNTHESIZER
      const runMillionRowsBenchmark = () => {
        setIsProcessingBigData(true);
        setProgressStats({
          processedRows: 0,
          targetRows: 1000000,
          percent: 0,
          throughput: 0,
          elapsedMs: 0,
          statusText: 'INITIALIZING 1,000,000 ROWS HIGH-THROUGHPUT STREAM SYNTHESIZER...'
        });

        const workerBlob = new Blob([`
          self.onmessage = function() {
            const targetRows = 1000000;
            const chunkSize = 50000;
            const startTime = performance.now();

            const regions = ['North America', 'EMEA (Europe)', 'Asia-Pacific', 'Latin America', 'South Asia'];
            const departments = ['Cyber Defense', 'Data Science', 'Cloud Operations', 'Threat Intel', 'Financial Fraud', 'DevSecOps'];
            const severities = ['Low', 'Medium', 'High', 'Critical'];
            const statuses = ['Automated Block', 'Under Investigation', 'Resolved', 'Quarantined', 'False Positive'];
            const paymentMethods = ['Corporate Wire', 'Credit Card', 'ACH Transfer', 'Crypto Escrow'];

            const colNames = ['Transaction_ID', 'Region', 'Department', 'Threat_Severity', 'Status', 'Payment_Method', 'Units_Sold', 'Revenue_USD', 'Latency_Ms'];
            
            const acc = {
              'Transaction_ID': { count: 0, nullCount: 0, type: 'ID (Unique)', freq: {} },
              'Region': { count: 0, nullCount: 0, freq: {}, type: 'Categorical (String)', min: null, max: null, sum: 0 },
              'Department': { count: 0, nullCount: 0, freq: {}, type: 'Categorical (String)', min: null, max: null, sum: 0 },
              'Threat_Severity': { count: 0, nullCount: 0, freq: {}, type: 'Categorical (String)', min: null, max: null, sum: 0 },
              'Status': { count: 0, nullCount: 0, freq: {}, type: 'Categorical (String)', min: null, max: null, sum: 0 },
              'Payment_Method': { count: 0, nullCount: 0, freq: {}, type: 'Categorical (String)', min: null, max: null, sum: 0 },
              'Units_Sold': { count: 0, nullCount: 0, freq: {}, type: 'Numerical (Int)', min: Infinity, max: -Infinity, sum: 0 },
              'Revenue_USD': { count: 0, nullCount: 0, freq: {}, type: 'Numerical (Float)', min: Infinity, max: -Infinity, sum: 0 },
              'Latency_Ms': { count: 0, nullCount: 0, freq: {}, type: 'Numerical (Int)', min: Infinity, max: -Infinity, sum: 0 }
            };

            const crossMetrics = {
              Region: { Revenue_USD: {}, Units_Sold: {}, Latency_Ms: {} },
              Department: { Revenue_USD: {}, Units_Sold: {}, Latency_Ms: {} },
              Threat_Severity: { Revenue_USD: {}, Units_Sold: {}, Latency_Ms: {} },
              Status: { Revenue_USD: {}, Units_Sold: {}, Latency_Ms: {} },
              Payment_Method: { Revenue_USD: {}, Units_Sold: {}, Latency_Ms: {} }
            };

            const previewRows = [];

            function processChunk(startIndex) {
              const endIndex = Math.min(startIndex + chunkSize, targetRows);

              for (let i = startIndex; i < endIndex; i++) {
                const reg = regions[i % 5];
                const dept = departments[(i * 7 + 2) % 6];
                const sev = severities[(i * 3 + 1) % 4];
                const stat = statuses[(i * 3 + 4) % 5];
                const pay = paymentMethods[(i * 5 + 2) % 4];
                const units = ((i * 17) % 195) + 5;
                const rev = Math.round((((i * 31) % 48000) + 120.50) * 100) / 100;
                const lat = ((i * 13) % 450) + 15;

                if (previewRows.length < 50) {
                  previewRows.push({
                    'Transaction_ID': 'TX-' + String(i + 1).padStart(7, '0'),
                    'Region': reg,
                    'Department': dept,
                    'Threat_Severity': sev,
                    'Status': stat,
                    'Payment_Method': pay,
                    'Units_Sold': units,
                    'Revenue_USD': '$' + rev.toFixed(2),
                    'Latency_Ms': lat + ' ms'
                  });
                }

                acc.Region.count++;
                acc.Region.freq[reg] = (acc.Region.freq[reg] || 0) + 1;
                crossMetrics.Region.Revenue_USD[reg] = (crossMetrics.Region.Revenue_USD[reg] || 0) + rev;
                crossMetrics.Region.Units_Sold[reg] = (crossMetrics.Region.Units_Sold[reg] || 0) + units;
                crossMetrics.Region.Latency_Ms[reg] = (crossMetrics.Region.Latency_Ms[reg] || 0) + lat;

                acc.Department.count++;
                acc.Department.freq[dept] = (acc.Department.freq[dept] || 0) + 1;
                crossMetrics.Department.Revenue_USD[dept] = (crossMetrics.Department.Revenue_USD[dept] || 0) + rev;
                crossMetrics.Department.Units_Sold[dept] = (crossMetrics.Department.Units_Sold[dept] || 0) + units;
                crossMetrics.Department.Latency_Ms[dept] = (crossMetrics.Department.Latency_Ms[dept] || 0) + lat;

                acc.Threat_Severity.count++;
                acc.Threat_Severity.freq[sev] = (acc.Threat_Severity.freq[sev] || 0) + 1;
                crossMetrics.Threat_Severity.Revenue_USD[sev] = (crossMetrics.Threat_Severity.Revenue_USD[sev] || 0) + rev;
                crossMetrics.Threat_Severity.Units_Sold[sev] = (crossMetrics.Threat_Severity.Units_Sold[sev] || 0) + units;

                acc.Status.count++;
                acc.Status.freq[stat] = (acc.Status.freq[stat] || 0) + 1;
                crossMetrics.Status.Revenue_USD[stat] = (crossMetrics.Status.Revenue_USD[stat] || 0) + rev;
                crossMetrics.Status.Units_Sold[stat] = (crossMetrics.Status.Units_Sold[stat] || 0) + units;

                acc.Payment_Method.count++;
                acc.Payment_Method.freq[pay] = (acc.Payment_Method.freq[pay] || 0) + 1;
                crossMetrics.Payment_Method.Revenue_USD[pay] = (crossMetrics.Payment_Method.Revenue_USD[pay] || 0) + rev;
                crossMetrics.Payment_Method.Units_Sold[pay] = (crossMetrics.Payment_Method.Units_Sold[pay] || 0) + units;

                acc.Units_Sold.count++;
                acc.Units_Sold.sum += units;
                if (units < acc.Units_Sold.min) acc.Units_Sold.min = units;
                if (units > acc.Units_Sold.max) acc.Units_Sold.max = units;

                acc.Revenue_USD.count++;
                acc.Revenue_USD.sum += rev;
                if (rev < acc.Revenue_USD.min) acc.Revenue_USD.min = rev;

              }

                action: 'PROGRESS',
                processedRows: endIndex,
                totalRows: targetRows,
                percent: Math.round((endIndex / targetRows) * 100),
                elapsedMs: Math.round(elapsed),
                throughput: throughput
              });

              if (endIndex < targetRows) {
                setTimeout(() => processChunk(endIndex), 0);
              } else {
                const finalCols = colNames.map(colName => {
                  const a = acc[colName];

                  let max = 'N/A';

                  let topCategory = 'N/A';

                  } else if (a.type.startsWith('Numerical')) {

                    const bins = {};
                    for (let b = 0; b < 6; b++) {

        const workerUrl = URL.createObjectURL(workerBlob);

      // GENERAL DATASET PROFILER (FOR EXCEL SHEETS, JSON ARRAYS & PARSED ROWS)
      const processParsedJsonRows = (sourceName, rows) => {
        if (!rows || !rows.length) {
          setIsProcessingBigData(false);
          setProgressStats(null);
          alert('Dataset contains no records.');
          return;
        }

        const startTime = performance.now();
        const colNames = Object.keys(rows[0]);
        const acc = {};
        colNames.forEach(col => {
          acc[col] = {
            count: 0,
            nullCount: 0,
            numericCount: 0,
            sum: 0,
            min: Infinity,
            max: -Infinity,
            freq: {}
          };
        });

        const rowCount = rows.length;
        for (let i = 0; i < rowCount; i++) {
          const r = rows[i];
          for (let j = 0; j < colNames.length; j++) {
            const col = colNames[j];
            const a = acc[col];
            const val = r[col];

            if (val === undefined || val === null || val === '') {
              a.nullCount++;
            } else {
              a.count++;
              const str = String(val).trim();
              if (Object.keys(a.freq).length < 50 || a.freq[str]) {
                a.freq[str] = (a.freq[str] || 0) + 1;
              }
              const num = Number(str.replace(/[^0-9.-]+/g, ''));
              if (!isNaN(num) && str !== '') {
                a.numericCount++;
                a.sum += num;
                if (num < a.min) a.min = num;
                if (num > a.max) a.max = num;
              }
            }
          }
        }

        const elapsed = performance.now() - startTime;
        let totalNulls = 0;
        const columns = colNames.map(col => {
          const a = acc[col];
          totalNulls += a.nullCount;
          const isNumeric = a.numericCount > 0 && a.numericCount >= a.count * 0.7;
          const uniqueKeys = Object.keys(a.freq);
          uniqueKeys.sort((k1, k2) => a.freq[k2] - a.freq[k1]);
          const topCategory = uniqueKeys[0] || 'N/A';

          let avg = 'N/A';
          let min = 'N/A';
          let max = 'N/A';
          let stats = '';

          if (isNumeric) {
            avg = (a.sum / a.numericCount).toFixed(2);
            min = a.min === Infinity ? 0 : a.min;
            max = a.max === -Infinity ? 0 : a.max;
            stats = `Avg: ${avg} | Min: ${min} | Max: ${max}`;
            if (uniqueKeys.length > 15) {
              const step = (max - min) / 6 || 1;
              const bins = {};
              for (let b = 0; b < 6; b++) {
                const bStart = Math.round(min + b * step);
                const bEnd = Math.round(min + (b + 1) * step);
                bins[`${bStart}-${bEnd}`] = Math.round(a.count / 6);
              }
              a.freq = bins;
            }
          } else {
            const topPct = a.count > 0 ? ((a.freq[topCategory] / a.count) * 100).toFixed(1) : 0;
            stats = `Top: ${topCategory} (${topPct}%)`;
          }

          return {
            name: col,
            type: isNumeric ? 'Numerical (Float/Int)' : 'Categorical (String)',
            uniqueCount: uniqueKeys.length >= 50 ? '50+ Distinct' : uniqueKeys.length,
            min: min,
            max: max,
            avg: avg,
            nullCount: a.nullCount,
            nullPct: ((a.nullCount / (a.count + a.nullCount || 1)) * 100).toFixed(1) + '%',
            stats: stats,
            topCategory: topCategory,
            frequencies: a.freq
          };
        });

        const numericCols = columns.filter(c => c.type.includes('Numerical'));

        setAnalyzedReport({
          sourceName: sourceName,
          rowCount: rowCount,
          colCount: colNames.length,
          parseTimeMs: Math.round(elapsed),
          throughput: Math.round(rowCount / (elapsed / 1000 || 0.001)),
          memoryEstimateMb: ((rowCount * colNames.length * 16) / (1024 * 1024)).toFixed(1) + ' MB',
          nullCount: totalNulls,
          columns: columns,
          previewRows: rows.slice(0, 50)

          setMetricField(numericCols[0].name);

        setIsProcessingBigData(false);
        setProgressStats(null);

      // UNIVERSAL MULTI-FORMAT FILE STREAMER (EXCEL, CSV, TSV, JSON)
      const handleUniversalFileUpload = (file) => {
        if (!file) return;
        const name = file.name.toLowerCase();

        // 1. Microsoft Excel Workbook (.xlsx, .xls, .ods)
        if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.ods')) {
          setIsProcessingBigData(true);
          setProgressStats({
            processedRows: 0,
            targetRows: 0,
            percent: 0,
            throughput: 0,
            elapsedMs: 0,
            statusText: `READING EXCEL WORKBOOK: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)...`
          });

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              const sheetName = workbook.SheetNames[0];
              const sheet = workbook.Sheets[sheetName];
              const jsonRows = window.XLSX.utils.sheet_to_json(sheet, { defval: '' });
              processParsedJsonRows(`${file.name} [Sheet: ${sheetName}]`, jsonRows);
            } catch (err) {
              setIsProcessingBigData(false);
              setProgressStats(null);
              alert('Excel reading error: ' + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
          return;
        }

        // 2. JSON Array File (.json)
        if (name.endsWith('.json')) {
          setIsProcessingBigData(true);
          setProgressStats({
            processedRows: 0,
            targetRows: 0,
            percent: 0,
            throughput: 0,
            elapsedMs: 0,
            statusText: `PARSING JSON DATASET: ${file.name}...`
          });

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              const rows = Array.isArray(parsed) ? parsed : [parsed];
              processParsedJsonRows(file.name, rows);
            } catch (err) {
              setIsProcessingBigData(false);
              setProgressStats(null);
              alert('JSON syntax error: ' + err.message);
            }
          };
          reader.readAsText(file);
          return;
        }

        // 3. Streaming CSV / TSV / TXT
        handleCsvFileStreaming(file);
      };

                    }
                    a.freq = bins;

                } else {
                  const topPct = a.count > 0 ? ((a.freq[topCategory] / a.count) * 100).toFixed(1) : 0;
                  stats = `Top: ${topCategory} (${topPct}%)`;
                }

                return {
                  name: col,

  <!-- Interactive Cyber Constellation & Cursor Particle Physics Engine -->
  <script>
    const cursorGlow = document.getElementById('cursor-glow');
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursorGlow.style.left = `${e.clientX}px`;
      cursorGlow.style.top = `${e.clientY}px`;
    });

    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.size = Math.random() * 2 + 1;
        this.color = Math.random() > 0.4 ? '#00f0ff' : '#ff007f';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const force = (mouse.radius - distance) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            const alpha = (1 - dist / 110) * 0.22;
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }

        const mdx = particles[i].x - mouse.x;
        const mdy = particles[i].y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if (mdist < 140) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          const alpha = (1 - mdist / 140) * 0.45;
          ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
