<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON // Cyber Defense & Data Analytics Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Orbitron & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #05070d;
      color: #e2e8f0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
        radial-gradient(circle at 100% 50%, rgba(255, 0, 128, 0.05), transparent 40%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .neon-cyan {
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6), 0 0 24px rgba(0, 240, 255, 0.3);
    }
    .neon-green {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }
    .neon-pink {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }
    .cyber-card {
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.03);
    }
    .cyber-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.06);
    }
    .cyber-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(255, 0, 127, 0.15));
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
    }
    .cyber-btn:hover {
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }
    #cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(255, 0, 127, 0.04) 50%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    #cyber-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #06080e; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <div id="cursor-glow"></div>
  <canvas id="cyber-canvas"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation state: 'analytics', 'cybersecurity', 'recon'
      const [currentView, setCurrentView] = useState('analytics');
      
      // 2FA Authenticator States
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [totpCode, setTotpCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [showSecretKey, setShowSecretKey] = useState(false);

      // OSINT Recon States
      const [target, setTarget] = useState('github.com');
      const [scanning, setScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('subdomains');
      const [dnsData, setDnsData] = useState(null);
      const [subdomainsData, setSubdomainsData] = useState(null);
      const [whoisData, setWhoisData] = useState(null);
      const [headersData, setHeadersData] = useState(null);
      // Real Data Analysis & EDA Workbench States
      const [rawInputData, setRawInputData] = useState('');
      const [analyzedReport, setAnalyzedReport] = useState(null);

      const loadSampleDataset = (type) => {
        if (type === 'sales') {
          const sample = [
            { "TransactionID": "TX-101", "Region": "North", "Product": "Firewall-X", "Units": 12, "Revenue": 24000, "CustomerSegment": "Enterprise" },
            { "TransactionID": "TX-102", "Region": "South", "Product": "SIEM-Cloud", "Units": 5, "Revenue": 15000, "CustomerSegment": "SMB" },
            { "TransactionID": "TX-103", "Region": "East", "Product": "EDR-Agent", "Units": 45, "Revenue": 31500, "CustomerSegment": "Enterprise" },
            { "TransactionID": "TX-104", "Region": "West", "Product": "Firewall-X", "Units": 8, "Revenue": 16000, "CustomerSegment": "Government" },
            { "TransactionID": "TX-105", "Region": "North", "Product": "SIEM-Cloud", "Units": 14, "Revenue": 42000, "CustomerSegment": "Enterprise" }
          ];
          setRawInputData(JSON.stringify(sample, null, 2));
        } else {
          const sample = [
            { "EventID": "EV-9901", "ThreatType": "DDoS_SYN_Flood", "SourceIP": "194.26.29.11", "TargetPort": 443, "Severity": "Critical", "Mitigated": "True" },
            { "EventID": "EV-9902", "ThreatType": "SQL_Injection", "SourceIP": "45.154.255.88", "TargetPort": 80, "Severity": "High", "Mitigated": "True" },
            { "EventID": "EV-9903", "ThreatType": "Brute_Force_SSH", "SourceIP": "185.220.101.5", "TargetPort": 22, "Severity": "Medium", "Mitigated": "True" },
            { "EventID": "EV-9904", "ThreatType": "DNS_Amplification", "SourceIP": "194.26.29.11", "TargetPort": 53, "Severity": "High", "Mitigated": "True" }
          ];
          setRawInputData(JSON.stringify(sample, null, 2));
        }
      };

      const handleAnalyzeDataset = () => {
        if (!rawInputData.trim()) return;
        try {
          let rows = [];
          // Support JSON or CSV
          if (rawInputData.trim().startsWith('[') || rawInputData.trim().startsWith('{')) {
            const parsed = JSON.parse(rawInputData);
            rows = Array.isArray(parsed) ? parsed : [parsed];
          } else {
            // Simple CSV parser
            const lines = rawInputData.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            for (let i = 1; i < lines.length; i++) {
              const vals = lines[i].split(',').map(v => v.trim());
              const obj = {};
              headers.forEach((h, idx) => { obj[h] = vals[idx] || ''; });
              rows.push(obj);
            }
          }

          if (!rows.length) return;
          const headers = Object.keys(rows[0]);
          const columnsAnalysis = headers.map(col => {
            const values = rows.map(r => r[col]).filter(v => v !== undefined && v !== '');
            const isNumeric = values.every(v => !isNaN(Number(v)));
            const uniqueSet = new Set(values);

            let stats = '';
            if (isNumeric) {
              const nums = values.map(v => Number(v));
              const sum = nums.reduce((a, b) => a + b, 0);
              const avg = (sum / nums.length).toFixed(1);
              const max = Math.max(...nums);
              const min = Math.min(...nums);
              stats = `Avg: ${avg} | Min: ${min} | Max: ${max}`;
            } else {
              stats = `Top Category: ${Array.from(uniqueSet)[0]} (${uniqueSet.size} classes)`;
            }

            return {
              name: col,
              type: isNumeric ? 'Numerical (Float/Int)' : 'Categorical (String)',
              uniqueCount: uniqueSet.size,
              stats
            };
          });

          setAnalyzedReport({
            rowCount: rows.length,
            colCount: headers.length,
            nullCount: 0,
            columns: columnsAnalysis
          });
        } catch (err) {
          alert('Invalid JSON or CSV format. Please check syntax.');
        }
      };

      // Real-time telemetry state from backend
      const [realMetrics, setRealMetrics] = useState({
        totalRequests: 0,
        serverUptimeSeconds: 0,
        memory: { usedRssMb: '0', systemUsedPct: '0%', heapUsedMb: '0' },
        system: { platform: 'win32', nodeVersion: 'v24', cpuCores: 8, loadAvg: '0' },
        cachedKeysCount: 0,
        recentLogs: []
      });

      useEffect(() => {
        const savedToken = sessionStorage.getItem('axon_clearance_token');
        if (savedToken) {
          setIsUnlocked(true);
        }

        const fetchLiveMetrics = async () => {
          try {
            const res = await fetch('/api/analytics/realtime');
            const data = await res.json();
            if (data.realtime) {
              setRealMetrics(data);
            }
          } catch (e) {}
        };

        fetchLiveMetrics();
        const interval = setInterval(fetchLiveMetrics, 2000);
        return () => clearInterval(interval);
      }, []);

      const handleVerifyTOTP = async (e) => {
        e.preventDefault();
        setVerifying(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const res = await fetch('/api/auth/verify-2fa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: totpCode })
          });
          const data = await res.json();

          if (data.success) {
            setAuthSuccess(data.message);
            sessionStorage.setItem('axon_clearance_token', data.token);
            setTimeout(() => {
              setIsUnlocked(true);
              setShowAuthModal(false);
              setCurrentView('recon');
              runScan('github.com');
            }, 1000);
          } else {
            setAuthError(data.message || 'INVALID 2FA AUTHENTICATOR CODE');
          }
        } catch (err) {
          setAuthError('AUTHENTICATION SERVER ERROR');
        } finally {
          setVerifying(false);
        }
      };

      const lockTerminal = () => {
        sessionStorage.removeItem('axon_clearance_token');
        setIsUnlocked(false);
        setCurrentView('analytics');
      };

      const runScan = async (domainToScan) => {
        const domain = domainToScan || target;
        if (!domain) return;
        setScanning(true);

        try {
          const [dRes, sRes, wRes, hRes] = await Promise.allSettled([
            fetch(`/api/osint/dns?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/subdomains?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/whois?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/headers?domain=${domain}`).then(r => r.json())
          ]);

          if (dRes.status === 'fulfilled') setDnsData(dRes.value);
          if (sRes.status === 'fulfilled') setSubdomainsData(sRes.value);
          if (wRes.status === 'fulfilled') setWhoisData(wRes.value);
          if (hRes.status === 'fulfilled') setHeadersData(hRes.value);
        } catch (e) {
          console.error(e);
        } finally {
          setScanning(false);
        }
      };

      return (
        <div class="max-w-7xl mx-auto px-4 py-6">
          {/* Top Bar / Navigation */}
          <header class="flex flex-col md:flex-row items-center justify-between pb-6 border-b border-cyan-500/20 gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-cyan-500/10 border border-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <span class="text-xl">🧬</span>
              </div>
              <div>
                <h1 class="text-2xl font-orbitron font-extrabold tracking-wider neon-cyan">
                  AXON // DATA ANALYTICS & CYBERSECURITY
                </h1>
                <p class="text-[11px] text-gray-400 font-mono flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  PRINCIPAL OPERATOR: ANSH // THREAT INTEL & DATA SCIENCE LAB
                </p>
              </div>
            </div>

            {/* Nav & 2FA Gate Button */}
            <div class="flex items-center gap-2">
              <button
                onClick={() => setCurrentView('analytics')}
                class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                  currentView === 'analytics'
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400 shadow-[0_0_12px_rgba(0,240,255,0.3)]'
                    : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                📊 DATA ANALYTICS
              </button>

              <button
                onClick={() => setCurrentView('cybersecurity')}
                class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                  currentView === 'cybersecurity'
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400 shadow-[0_0_12px_rgba(0,240,255,0.3)]'
                    : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                🛡️ CYBER DEFENSE
              </button>

              {isUnlocked ? (
                <div class="flex items-center gap-2">
                  <button
                    onClick={() => setCurrentView('recon')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                      currentView === 'recon'
                        ? 'bg-pink-500/20 text-pink-300 border border-pink-400 shadow-[0_0_12px_rgba(255,0,127,0.3)]'
                        : 'text-pink-400 hover:text-pink-300'
                    }`}
                  >
                    ⚡ RECON TERMINAL [UNLOCKED]
                  </button>
                  <button
                    onClick={lockTerminal}
                    title="Lock Restricted Terminal"
                    class="px-2.5 py-1.5 rounded-lg bg-rose-950/60 border border-rose-500/40 text-rose-400 text-xs hover:bg-rose-900 transition font-orbitron"
                  >
                    🔒 LOCK RECON
                  </button>
                </div>
              ) : null}
            </div>
          </header>

          {/* ======================================================== */}
          {/* VIEW 1: DATA ANALYTICS HUB */}
          {/* ======================================================== */}
          {currentView === 'analytics' && (
            <div class="mt-8 space-y-6">
              {/* Data Analyst Professional Toolkit Grid (With Direct Tool Launchers) */}
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-xs font-orbitron font-bold neon-cyan flex items-center gap-2">
                    <span>🧰</span> DATA ANALYST TOOLKIT // DIRECT WORKBENCH & REDIRECTS
                  </h3>
                  <span class="text-[10px] text-gray-500 font-mono">INDUSTRY STANDARD EDA & QUERY TOOLS</span>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                  {[
                    { name: 'Google BigQuery', type: 'SQL Data Warehouse', icon: '⚡', url: 'https://console.cloud.google.com/bigquery' },
                    { name: 'Google Colab / Jupyter', type: 'Python & Pandas', icon: '🐍', url: 'https://colab.research.google.com' },
                    { name: 'Tableau Public', type: 'BI & Visuals', icon: '📊', url: 'https://public.tableau.com' },
                    { name: 'Power BI Service', type: 'Enterprise BI', icon: '📈', url: 'https://app.powerbi.com' },
                    { name: 'Metabase Open', type: 'Dashboarding', icon: '📉', url: 'https://www.metabase.com' },
                    { name: 'Kaggle Datasets', type: 'Raw Intelligence', icon: '🧠', url: 'https://www.kaggle.com/datasets' }
                  ].map((tool, idx) => (
                    <a
                      key={idx}
                      href={tool.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      class="cyber-card p-3 rounded-xl block hover:border-cyan-400/60 transition group text-left"
                    >
                      <div class="flex items-center justify-between">
                        <span class="text-xl">{tool.icon}</span>
                        <span class="text-[9px] font-mono text-cyan-400 group-hover:translate-x-0.5 transition">↗</span>
                      </div>
                      <h4 class="text-xs font-orbitron font-bold text-gray-200 mt-2 group-hover:text-cyan-300 transition truncate">{tool.name}</h4>
                      <p class="text-[9px] font-mono text-gray-500 truncate">{tool.type}</p>
                    </a>
                  ))}
                </div>
              </div>

              {/* REAL INTERACTIVE DATA BREAKDOWN & EDA WORKBENCH */}
              <div class="cyber-card p-6 rounded-2xl border-cyan-500/30">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4 pb-3 border-b border-gray-800">
                  <div>
                    <h3 class="text-sm font-orbitron font-bold neon-green flex items-center gap-2">
                      <span>🔬</span> LIVE DATA BREAKDOWN & METRIC ENGINE (ANALYST COCKPIT)
                    </h3>
                    <p class="text-[11px] text-gray-400 font-mono mt-0.5">
                      Upload or Paste Any JSON / CSV / Raw Logs To Generate Instant Statistical Breakdown & Summary
                    </p>
                  </div>

                  <div class="flex items-center gap-2">
                    <button
                      onClick={() => loadSampleDataset('sales')}
                      class="px-2.5 py-1 bg-cyan-950/60 border border-cyan-500/30 rounded text-[11px] font-mono text-cyan-300 hover:bg-cyan-500 hover:text-black transition"
                    >
                      Sample: Sales Matrix
                    </button>
                    <button
                      onClick={() => loadSampleDataset('cyber')}
                      class="px-2.5 py-1 bg-pink-950/60 border border-pink-500/30 rounded text-[11px] font-mono text-pink-300 hover:bg-pink-500 hover:text-black transition"
                    >
                      Sample: Incident Logs
                    </button>
                  </div>
                </div>

                {/* Input Area for Data Analysis */}
                <div class="space-y-3">
                  <textarea
                    rows="3"
                    value={rawInputData}
                    onChange={(e) => setRawInputData(e.target.value)}
                    placeholder='Paste raw CSV, JSON array, or click sample dataset above...'
                    class="w-full p-3 bg-black/60 border border-cyan-500/30 rounded-xl text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-400"
                  ></textarea>

                  <div class="flex justify-between items-center">
                    <span class="text-[10px] text-gray-500 font-mono">
                      {analyzedReport ? `Analyzed ${analyzedReport.rowCount} Rows Across ${analyzedReport.colCount} Dimensions` : 'Ready to parse'}
                    </span>
                    <button
                      onClick={handleAnalyzeDataset}
                      class="cyber-btn px-6 py-2 rounded-xl text-xs font-orbitron font-bold text-cyan-300 tracking-wider flex items-center gap-2 cursor-pointer"
                    >
                      <span>⚡</span>
                      EXECUTE DATA BREAKDOWN & PUBLISH REPORT
                    </button>
                  </div>
                </div>

                {/* PUBLISHED DATA BREAKDOWN REPORT VIEW */}
                {analyzedReport && (
                  <div class="mt-6 pt-4 border-t border-cyan-500/20 space-y-4">
                    {/* Summary Metric Pills */}
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                      <div class="p-3 bg-black/40 border border-gray-800 rounded-xl">
                        <span class="text-[10px] text-gray-500 font-mono block">TOTAL OBSERVATIONS</span>
                        <span class="text-xl font-orbitron font-bold text-cyan-400">{analyzedReport.rowCount}</span>
                      </div>
                      <div class="p-3 bg-black/40 border border-gray-800 rounded-xl">
                        <span class="text-[10px] text-gray-500 font-mono block">ATTRIBUTES / COLUMNS</span>
                        <span class="text-xl font-orbitron font-bold text-emerald-400">{analyzedReport.colCount}</span>
                      </div>
                      <div class="p-3 bg-black/40 border border-gray-800 rounded-xl">
                        <span class="text-[10px] text-gray-500 font-mono block">MISSING / NULL VALUES</span>
                        <span class="text-xl font-orbitron font-bold text-pink-400">{analyzedReport.nullCount} (0%)</span>
                      </div>
                      <div class="p-3 bg-black/40 border border-gray-800 rounded-xl">
                        <span class="text-[10px] text-gray-500 font-mono block">HEALTH & COMPLETENESS</span>
                        <span class="text-xl font-orbitron font-bold text-amber-400">100% COMPLETE</span>
                      </div>
                    </div>

                    {/* Column Statistical Breakdown Table */}
                    <div class="overflow-x-auto">
                      <table class="w-full text-left font-mono text-xs">
                        <thead>
                          <tr class="border-b border-gray-800 text-gray-500 text-[10px] uppercase">
                            <th class="pb-2">Field Name</th>
                            <th class="pb-2">Inferred Type</th>
                            <th class="pb-2">Unique Values</th>
                            <th class="pb-2">Statistical Measure / Top Category</th>
                            <th class="pb-2">Data Quality</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-900/40">
                          {analyzedReport.columns.map((col, idx) => (
                            <tr key={idx} class="hover:bg-slate-900/30 transition">
                              <td class="py-2 text-cyan-300 font-bold">{col.name}</td>
                              <td class="py-2 text-emerald-400">{col.type}</td>
                              <td class="py-2 text-gray-400">{col.uniqueCount}</td>
                              <td class="py-2 text-pink-300">{col.stats}</td>
                              <td class="py-2">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-500/40">
                                  CLEAN
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>

              {/* Real Server Telemetry Stream (Live Traffic Table) */}
              <div class="cyber-card p-6 rounded-2xl">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-sm font-orbitron font-bold neon-cyan flex items-center gap-2">
                    <span>📈</span> LIVE INGESTED TRAFFIC & SYSTEM TELEMETRY
                  </h3>
                  <span class="text-[10px] text-emerald-400 px-2 py-0.5 bg-emerald-950/60 rounded border border-emerald-500/30 font-mono">
                    LIVE STREAM (AUTO-REFRESH 2S)
                  </span>
                </div>

                <div class="overflow-x-auto max-h-[220px] overflow-y-auto">
                  <table class="w-full text-left font-mono text-xs">
                    <thead>
                      <tr class="border-b border-gray-800 text-gray-500 text-[10px] uppercase">
                        <th class="pb-2">Time</th>
                        <th class="pb-2">Method</th>
                        <th class="pb-2">Endpoint</th>
                        <th class="pb-2">Client IP</th>
                        <th class="pb-2">Status</th>
                        <th class="pb-2">Latency</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-900/50">
                      {realMetrics.recentLogs && realMetrics.recentLogs.length > 0 ? (
                        realMetrics.recentLogs.map((log, idx) => (
                          <tr key={idx} class="hover:bg-slate-900/30 transition">
                            <td class="py-2 text-gray-400 text-[11px]">{log.timestamp}</td>
                            <td class="py-2 font-bold text-cyan-400">{log.method}</td>
                            <td class="py-2 text-gray-300 truncate max-w-[160px]">{log.path}</td>
                            <td class="py-2 text-gray-400 text-[11px]">{log.ip}</td>
                            <td class="py-2">

  <!-- Interactive Cyber Constellation & Cursor Particle Physics Engine -->
  <script>
    const cursorGlow = document.getElementById('cursor-glow');
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursorGlow.style.left = `${e.clientX}px`;
      cursorGlow.style.top = `${e.clientY}px`;
    });

    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.size = Math.random() * 2 + 1;
        this.color = Math.random() > 0.4 ? '#00f0ff' : '#ff007f';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const force = (mouse.radius - distance) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            const alpha = (1 - dist / 110) * 0.22;
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }

        const mdx = particles[i].x - mouse.x;
        const mdy = particles[i].y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if (mdist < 140) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          const alpha = (1 - mdist / 140) * 0.45;
          ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
