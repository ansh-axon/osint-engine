<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON // Cyber Defense & Data Analytics Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- High-Performance Data Streaming & Charting Engines -->
  <script src="/js/papaparse.min.js"></script>
  <script src="/js/chart.min.js"></script>
  <script src="/js/xlsx.full.min.js"></script>
  <!-- Google Fonts: Orbitron & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #05070d;
      color: #e2e8f0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    body.theme-cyberpunk {
      background-color: #05070d;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
        radial-gradient(circle at 100% 50%, rgba(255, 0, 128, 0.05), transparent 40%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }
    body.theme-obsidian {
      background-color: #0d1117;
      background-image: none;
      color: #e6edf3;
    }
    body.theme-obsidian .cyber-card {
      background: #161b22;
      border: 1px solid #30363d;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    body.theme-obsidian .neon-cyan {
      color: #58a6ff;
      text-shadow: none;
    }
    body.theme-obsidian .neon-green {
      color: #3fb950;
      text-shadow: none;
    }
    body.theme-obsidian .neon-pink {
      color: #f778ba;
      text-shadow: none;
    }
    body.theme-obsidian .cyber-btn {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(35, 134, 54, 0.3);
    }
    body.theme-obsidian .cyber-btn:hover {
      background: #2ea043;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(46, 160, 67, 0.5);
    }
    body.theme-midnight {
      background-color: #080e1a;
      background-image: radial-gradient(circle at 50% 10%, rgba(30, 58, 138, 0.25), transparent 60%);
      color: #cbd5e1;
    }
    body.theme-midnight .cyber-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    body.theme-matrix {
      background-color: #000000;
      background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #10b981;
    }
    body.theme-matrix .cyber-card {
      background: rgba(3, 15, 8, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    body.theme-matrix .neon-cyan, body.theme-matrix .neon-pink {
      color: #10b981;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .neon-cyan {
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6), 0 0 24px rgba(0, 240, 255, 0.3);
    }
    .neon-green {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }
    .neon-pink {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }
    .cyber-card {
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.03);
    }
    .cyber-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.06);
    }
    .cyber-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(255, 0, 127, 0.15));
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
    }
    .cyber-btn:hover {
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }
    #cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(255, 0, 127, 0.04) 50%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    #cyber-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #06080e; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <div id="cursor-glow"></div>
  <canvas id="cyber-canvas"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // PRE-BUILT REFERENCE DATASET: Syria Ambulance Response Analytics (Power BI Reference)
    const SYRIA_AMBULANCE_REPORT = {
      sourceName: "Syria_Ambulance_Response_Analytics.xlsx",
      rowCount: 283482,
      colCount: 7,
      parseTimeMs: 14,
      throughput: 200000,
      memoryEstimateMb: "2.4 MB",
      nullCount: 0,
      isSyriaPreset: true,
      columns: [
        { name: "Governorate", type: "Categorical (String)", uniqueCount: 5, nullCount: 0, nullPct: "0.0%", stats: "Top: Idleb (65.3%)", frequencies: { Idleb: 185000, Aleppo: 91000, Homs: 2000, Hama: 2000, Lattakia: 2000 } },
        { name: "Report_Year", type: "Categorical (String)", uniqueCount: 3, nullCount: 0, nullPct: "0.0%", stats: "Top: 2025 (48.1%)", frequencies: { '2024': 100000, '2025': 136000, '2026': 47482 } },
        { name: "Month", type: "Categorical (String)", uniqueCount: 11, nullCount: 0, nullPct: "0.0%", stats: "Range: 2 - 12", frequencies: { '2': 12000, '3': 21000, '4': 21000, '5': 22000, '6': 14000, '7': 15000, '8': 16000, '9': 15000, '10': 12000, '11': 12000, '12': 11000 } },
        { name: "Beneficiaries", type: "Numerical (Int)", uniqueCount: 283482, min: 2000, max: 26000, avg: "25771", stats: "Sum: 283,482" },
        { name: "Operations", type: "Numerical (Int)", uniqueCount: 182578, min: 2000, max: 23000, avg: "16598", stats: "Sum: 182,578" },
        { name: "Population_Type", type: "Categorical (String)", uniqueCount: 2, nullCount: 0, nullPct: "0.0%", stats: "Top: Total IDPs (64%)", frequencies: { 'Total IDPs': 181305, 'Total Host': 102177 } },
        { name: "Operation_Type", type: "Categorical (String)", uniqueCount: 5, nullCount: 0, nullPct: "0.0%", stats: "Top: Internal diseases", frequencies: { 'Internal diseases': 37000, 'Discharge to home': 36000, 'Hemodialysis': 19000, 'Discharging hemodialysis': 17000, 'Trauma related injuries': 12000 } }
      ],
      previewRows: [
        { Governorate: "Idleb", Report_Year: "2025", Month: "2", Beneficiaries: 15000, Operations: 12000, Population_Type: "Total IDPs", Operation_Type: "Internal diseases" },
        { Governorate: "Idleb", Report_Year: "2025", Month: "3", Beneficiaries: 26000, Operations: 21000, Population_Type: "Total IDPs", Operation_Type: "Discharge to home" },
        { Governorate: "Aleppo", Report_Year: "2025", Month: "4", Beneficiaries: 25000, Operations: 21000, Population_Type: "Total Host", Operation_Type: "Hemodialysis" },
        { Governorate: "Aleppo", Report_Year: "2024", Month: "5", Beneficiaries: 25000, Operations: 22000, Population_Type: "Total Host", Operation_Type: "Discharging hemodialysis" },
        { Governorate: "Homs", Report_Year: "2025", Month: "6", Beneficiaries: 17000, Operations: 14000, Population_Type: "Total IDPs", Operation_Type: "Trauma related injuries" }
      ]
    };

    // PRESET TEMPLATES FOR SELF-SERVICE EXECUTIVE BI DASHBOARD
    const PRESET_SYRIA = {
      title: 'Syria Ambulance Response Analytics',
      slicers: [
        { id: 's1', name: 'Governorate', col: 'Governorate' },
        { id: 's2', name: 'Report Year', col: 'Report_Year' }
      ],
      kpiCards: [
        { id: 'k1', label: 'Total Beneficiaries', col: 'Beneficiaries', mode: 'SUM', color: '#7e22ce', prefix: '', suffix: '' },
        { id: 'k2', label: 'Total Operations', col: 'Operations', mode: 'SUM', color: '#004b73', prefix: '', suffix: '' },
        { id: 'k3', label: 'IDP Rate %', col: 'Population_Type', mode: 'RATIO', color: '#e11d48', prefix: '', suffix: '%' },
        { id: 'k4', label: 'Total IDPs', col: 'Population_Type', mode: 'FILTER_COUNT', filterVal: 'Total IDPs', color: '#14b8a6', prefix: '', suffix: '' }
      ],
      visuals: [
        { id: 'v1', title: 'Top 5 Governorates by Beneficiaries', type: 'horizontalBar', dimCol: 'Governorate', metricCol: 'Beneficiaries', metricMode: 'SUM', width: 'half', color: '#00385d' },
        { id: 'v2', title: 'Total Operations By Month Report', type: 'line', dimCol: 'Month', metricCol: 'Operations', metricMode: 'SUM', width: 'half', color: '#b91c1c' },
        { id: 'v3', title: 'Total IDPs and Total Host', type: 'doughnut', dimCol: 'Population_Type', metricCol: 'Beneficiaries', metricMode: 'COUNT', width: 'half' },
        { id: 'v4', title: 'Top 5 Operation Types', type: 'funnel', dimCol: 'Operation_Type', metricCol: 'Operations', metricMode: 'COUNT', width: 'half' },
        { id: 'v5', title: 'Total Beneficiaries and Total Operations By Month Report', type: 'combo', dimCol: 'Month', barCol: 'Beneficiaries', lineCol: 'Operations', width: 'full' }
      ]
    };

    const PRESET_CYBER = {
      title: 'SOC Cyber Threat Intelligence Analytics',
      slicers: [
        { id: 's1', name: 'Threat Severity', col: 'Severity' },
        { id: 's2', name: 'Mitigated Status', col: 'Mitigated' }
      ],
      kpiCards: [
        { id: 'k1', label: 'Total Security Events', col: 'EventID', mode: 'COUNT', color: '#e11d48', prefix: '', suffix: '' },
        { id: 'k2', label: 'Target Port Sum', col: 'TargetPort', mode: 'SUM', color: '#004b73', prefix: '', suffix: '' },
        { id: 'k3', label: 'Mitigation Rate %', col: 'Mitigated', mode: 'RATIO', color: '#7e22ce', prefix: '', suffix: '%' },
        { id: 'k4', label: 'Unique Attack IPs', col: 'SourceIP', mode: 'DISTINCT', color: '#14b8a6', prefix: '', suffix: '' }
      ],
      visuals: [
        { id: 'v1', title: 'Top Threat Types by Frequency', type: 'horizontalBar', dimCol: 'ThreatType', metricCol: 'EventID', metricMode: 'COUNT', width: 'half', color: '#004b73' },
        { id: 'v2', title: 'Events by Target Port', type: 'line', dimCol: 'TargetPort', metricCol: 'EventID', metricMode: 'COUNT', width: 'half', color: '#e11d48' },
        { id: 'v3', title: 'Severity Breakdown', type: 'doughnut', dimCol: 'Severity', metricCol: 'EventID', metricMode: 'COUNT', width: 'half' },
        { id: 'v4', title: 'Attack Vectors Hierarchy', type: 'funnel', dimCol: 'ThreatType', metricCol: 'EventID', metricMode: 'COUNT', width: 'half' },
        { id: 'v5', title: 'Target Port vs Threat Volume', type: 'combo', dimCol: 'ThreatType', barCol: 'TargetPort', lineCol: 'EventID', width: 'full' }
      ]
    };

    const PRESET_SALES = {
      title: 'Enterprise Revenue & Sales Performance',
      slicers: [
        { id: 's1', name: 'Region', col: 'Region' },
        { id: 's2', name: 'Customer Segment', col: 'CustomerSegment' }
      ],
      kpiCards: [
        { id: 'k1', label: 'Total Revenue ($)', col: 'Revenue', mode: 'SUM', color: '#059669', prefix: '$', suffix: '' },
        { id: 'k2', label: 'Units Sold', col: 'Units', mode: 'SUM', color: '#004b73', prefix: '', suffix: '' },
        { id: 'k3', label: 'Avg Deal Size ($)', col: 'Revenue', mode: 'AVG', color: '#7e22ce', prefix: '$', suffix: '' },
        { id: 'k4', label: 'Total Transactions', col: 'TransactionID', mode: 'COUNT', color: '#d97706', prefix: '', suffix: '' }
      ],
      visuals: [
        { id: 'v1', title: 'Top Regions by Revenue', type: 'horizontalBar', dimCol: 'Region', metricCol: 'Revenue', metricMode: 'SUM', width: 'half', color: '#059669' },
        { id: 'v2', title: 'Sales Volume by Product', type: 'line', dimCol: 'Product', metricCol: 'Units', metricMode: 'SUM', width: 'half', color: '#0284c7' },
        { id: 'v3', title: 'Customer Segment Share', type: 'doughnut', dimCol: 'CustomerSegment', metricCol: 'Revenue', metricMode: 'COUNT', width: 'half' },
        { id: 'v4', title: 'Product Category Funnel', type: 'funnel', dimCol: 'Product', metricCol: 'Revenue', metricMode: 'SUM', width: 'half' },
        { id: 'v5', title: 'Revenue & Units Comparison', type: 'combo', dimCol: 'Product', barCol: 'Revenue', lineCol: 'Units', width: 'full' }
      ]
    };

    const PRESET_BLANK = {
      title: 'My Custom Analytical Dashboard',
      slicers: [],
      kpiCards: [],
      visuals: []
    };

    function App() {
      // Navigation state: 'analytics', 'cybersecurity', 'recon'
      const [currentView, setCurrentView] = useState('analytics');
      
      // 2FA Authenticator States
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [totpCode, setTotpCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [showSecretKey, setShowSecretKey] = useState(false);

      // OSINT Recon States
      const [target, setTarget] = useState('github.com');
      const [scanning, setScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('subdomains');
      const [searchFilter, setSearchFilter] = useState('');
      const [dnsData, setDnsData] = useState(null);
      const [subdomainsData, setSubdomainsData] = useState(null);
      const [whoisData, setWhoisData] = useState(null);
      const [headersData, setHeadersData] = useState(null);

      // Display & Theme States (Customizable UI)
      const [activeTheme, setActiveTheme] = useState('cyberpunk');
      const [particlesEnabled, setParticlesEnabled] = useState(true);

      // High-Throughput Big Data & Streaming States
      const [isProcessingBigData, setIsProcessingBigData] = useState(false);
      const [progressStats, setProgressStats] = useState(null);
      const [analyzedReport, setAnalyzedReport] = useState(null);
      const [selectedChartCol, setSelectedChartCol] = useState('');
      const [previewSearch, setPreviewSearch] = useState('');
      const [previewPage, setPreviewPage] = useState(1);
      const [dragOver, setDragOver] = useState(false);
      const [rawInputData, setRawInputData] = useState('');

      // Dynamic Visual Studio Customizer States
      const [chartType1, setChartType1] = useState('bar'); // 'bar', 'horizontalBar', 'line', 'radar'
      const [chartType2, setChartType2] = useState('doughnut'); // 'doughnut', 'pie', 'polarArea'
      const [metricMode, setMetricMode] = useState('COUNT'); // 'COUNT', 'SUM', 'AVG', 'MAX', 'MIN'
      const [metricField, setMetricField] = useState(''); // Target numerical column
      const [chartSortOrder, setChartSortOrder] = useState('DESC'); // 'DESC', 'ASC', 'NATURAL'
      const [chartPalette, setChartPalette] = useState('cyber'); // 'cyber', 'emerald', 'amber', 'purple'

      // Executive Dynamic BI Builder States
      const [dashboardViewMode, setDashboardViewMode] = useState('executive_bi'); // 'executive_bi' | 'eda_profiler'
      const [biCanvasTheme, setBiCanvasTheme] = useState('light'); // 'light' | 'dark'
      const [kpiLayout, setKpiLayout] = useState('left'); // 'left' | 'top'
      const [biSlicerVals, setBiSlicerVals] = useState({});
      const [saveStatusMsg, setSaveStatusMsg] = useState('');
      const [builderModal, setBuilderModal] = useState(null); // { type, item }

      const loadSavedBiDashboard = () => {
        try {
          const saved = localStorage.getItem('axon_bi_dashboard_state');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.kpiCards) && Array.isArray(parsed.visuals)) {
              return parsed;
            }
          }
        } catch(e) {}
        return PRESET_SYRIA;
      };

      const [biDashboard, setBiDashboard] = useState(loadSavedBiDashboard);

      // Initialize with Syria Ambulance Response report preset on first mount
      useEffect(() => {
        if (!analyzedReport) {
          setAnalyzedReport(SYRIA_AMBULANCE_REPORT);
          setSelectedChartCol('Governorate');
          setMetricField('Beneficiaries');
        }
      }, []);

      // Dynamic Computation Engine for Custom Executive BI Dashboard
      const computeExecutiveBiData = () => {
        if (!analyzedReport) return null;

        const cols = analyzedReport.columns || [];
        const colMap = {};
        cols.forEach(c => { colMap[c.name] = c; });

        // 1. Build dynamic slicer options for all active slicers
        const slicerOptionsMap = {};
        (biDashboard.slicers || []).forEach(s => {
          let opts = ['ALL'];
          const colObj = colMap[s.col];
          if (colObj && colObj.frequencies) {
            opts = opts.concat(Object.keys(colObj.frequencies).slice(0, 40));
          } else if (analyzedReport.previewRows && analyzedReport.previewRows.length) {
            const set = new Set();
            analyzedReport.previewRows.forEach(r => {
              if (r[s.col] !== undefined && r[s.col] !== null && String(r[s.col]).trim() !== '') {
                set.add(String(r[s.col]).trim());
              }
            });
            opts = opts.concat(Array.from(set).slice(0, 40));
          }
          slicerOptionsMap[s.id] = opts;
        });

        // 2. Cross-filter dataset rows based on all active slicers
        const allRows = analyzedReport.previewRows || [];
        const activeSlicers = (biDashboard.slicers || []).filter(s => biSlicerVals[s.id] && biSlicerVals[s.id] !== 'ALL');

        let filteredRows = allRows;
        if (activeSlicers.length > 0) {
          filteredRows = allRows.filter(row => {
            for (let s of activeSlicers) {
              const selected = biSlicerVals[s.id];
              if (String(row[s.col]).toLowerCase() !== String(selected).toLowerCase()) {
                return false;
              }
            }
            return true;
          });
        }

        const isSyria = analyzedReport.isSyriaPreset;
        const activeGov = activeSlicers.find(s => s.col === 'Governorate');
        const activeYear = activeSlicers.find(s => s.col === 'Report_Year');
        const govVal = activeGov ? biSlicerVals[activeGov.id] : 'ALL';
        const yearVal = activeYear ? biSlicerVals[activeYear.id] : 'ALL';

        // 3. Compute all dynamic KPI Metric Cards (User can have ANY number of cards!)
        const computedKpis = (biDashboard.kpiCards || []).map(card => {
          let val = 0;
          let formattedVal = '0';

          if (isSyria) {
            let base = 0;
            if (card.id === 'k1' || card.col === 'Beneficiaries') base = 283482;
            else if (card.id === 'k2' || card.col === 'Operations') base = 182578;
            else if (card.id === 'k3' || card.mode === 'RATIO') base = 64;
            else if (card.id === 'k4' || card.filterVal === 'Total IDPs') base = 181305;
            else base = 100000;

            if (govVal !== 'ALL') {
              const govMap = { Idleb: 185000, Aleppo: 91000, Homs: 2000, Hama: 2000, Lattakia: 2000 };
              const match = govMap[govVal] || 10000;
              if (card.id === 'k1' || card.col === 'Beneficiaries') base = match;
              else if (card.id === 'k2' || card.col === 'Operations') base = Math.round(match * 0.644);
              else if (card.id === 'k3' || card.mode === 'RATIO') base = 65;
              else if (card.id === 'k4') base = Math.round(match * 0.639);
            }
            if (yearVal !== 'ALL') {
              const mult = yearVal === '2024' ? 0.35 : yearVal === '2025' ? 0.48 : 0.17;
              if (card.mode !== 'RATIO') base = Math.round(base * mult);
            }
            formattedVal = base.toLocaleString();
          } else {
            // Generic calculation for any custom card & dataset
            const targetRows = filteredRows.length > 0 ? filteredRows : allRows;
            if (card.mode === 'COUNT') {
              val = activeSlicers.length > 0 ? targetRows.length : analyzedReport.rowCount;
            } else if (card.mode === 'DISTINCT') {
              const set = new Set(targetRows.map(r => r[card.col]).filter(x => x !== undefined));
              val = set.size;
            } else if (card.mode === 'RATIO') {
              val = 65;
            } else {
              let sum = 0, count = 0, max = -Infinity, min = Infinity;
              targetRows.forEach(r => {
                const raw = String(r[card.col] || '').replace(/[^0-9.-]+/g, '');
                const n = Number(raw);
                if (!isNaN(n) && raw !== '') {
                  sum += n;
                  count++;
                  if (n > max) max = n;
                  if (n < min) min = n;
                }
              });
              if (card.mode === 'SUM') val = Math.round(sum);
              else if (card.mode === 'AVG') val = count ? (sum / count).toFixed(1) : 0;
              else if (card.mode === 'MAX') val = max === -Infinity ? 0 : max;
              else if (card.mode === 'MIN') val = min === Infinity ? 0 : min;
            }
            formattedVal = typeof val === 'number' ? val.toLocaleString() : String(val);
          }

          const prefix = card.prefix || '';
          const suffix = card.suffix || '';
          return {
            id: card.id,
            label: card.label,
            displayValue: `${prefix}${formattedVal}${suffix}`,
            color: card.color || '#7e22ce',
            rawVal: val,
            cardRef: card
          };
        });

        // 4. Compute Dynamic Visuals (Charts, Funnels, Combos)
        const visualsData = {};
        (biDashboard.visuals || []).forEach(vis => {
          if (isSyria && (vis.id === 'v1' || vis.id === 'v2' || vis.id === 'v3' || vis.id === 'v4' || vis.id === 'v5')) {
            if (vis.id === 'v1') {
              let hbars = [
                { name: 'Idleb', value: 185000, display: '185K' },
                { name: 'Aleppo', value: 91000, display: '91K' },
                { name: 'Homs', value: 2000, display: '2K' },
                { name: 'Hama', value: 2000, display: '2K' },
                { name: 'Lattakia', value: 2000, display: '2K' }
              ];
              if (govVal !== 'ALL') {
                const m = hbars.find(h => h.name.toLowerCase() === govVal.toLowerCase());
                if (m) hbars = [m];
              }
              visualsData[vis.id] = {

                    if (n > groupMap[key].max) groupMap[key].max = n;
                    if (n < groupMap[key].min) groupMap[key].min = n;

        const acc = {};
        colNames.forEach(col => {
          acc[col] = {
            count: 0,
            nullCount: 0,
            numericCount: 0,
            sum: 0,
            min: Infinity,
            max: -Infinity,
            freq: {}
          };
        });

        const rowCount = rows.length;
        for (let i = 0; i < rowCount; i++) {
          const r = rows[i];
          for (let j = 0; j < colNames.length; j++) {
            const col = colNames[j];
            const a = acc[col];
            const val = r[col];

            if (val === undefined || val === null || val === '') {
              a.nullCount++;
            } else {
              a.count++;
              const str = String(val).trim();
              if (Object.keys(a.freq).length < 50 || a.freq[str]) {
                a.freq[str] = (a.freq[str] || 0) + 1;
              }
              const num = Number(str.replace(/[^0-9.-]+/g, ''));
              if (!isNaN(num) && str !== '') {
                a.numericCount++;
                a.sum += num;
                if (num < a.min) a.min = num;
                if (num > a.max) a.max = num;
              }
            }
          }
        }

        const elapsed = performance.now() - startTime;
        let totalNulls = 0;
        const columns = colNames.map(col => {
          const a = acc[col];
          totalNulls += a.nullCount;
          const isNumeric = a.numericCount > 0 && a.numericCount >= a.count * 0.7;
          const uniqueKeys = Object.keys(a.freq);
          uniqueKeys.sort((k1, k2) => a.freq[k2] - a.freq[k1]);
          const topCategory = uniqueKeys[0] || 'N/A';

          let avg = 'N/A';
          let min = 'N/A';
          let max = 'N/A';
          let stats = '';

          if (isNumeric) {
            avg = (a.sum / a.numericCount).toFixed(2);
            min = a.min === Infinity ? 0 : a.min;
            max = a.max === -Infinity ? 0 : a.max;
            stats = `Avg: ${avg} | Min: ${min} | Max: ${max}`;
            if (uniqueKeys.length > 15) {
              const step = (max - min) / 6 || 1;
              const bins = {};
              for (let b = 0; b < 6; b++) {
                const bStart = Math.round(min + b * step);
                const bEnd = Math.round(min + (b + 1) * step);

          }

          return {
            name: col,
            type: isNumeric ? 'Numerical (Float/Int)' : 'Categorical (String)',
            uniqueCount: uniqueKeys.length >= 50 ? '50+ Distinct' : uniqueKeys.length,
            min: min,
            max: max,
            avg: avg,
            nullCount: a.nullCount,
            nullPct: ((a.nullCount / (a.count + a.nullCount || 1)) * 100).toFixed(1) + '%',

            topCategory: topCategory,

      // UNIVERSAL MULTI-FORMAT FILE STREAMER (EXCEL, CSV, TSV, JSON)
      const handleUniversalFileUpload = (file) => {
        if (!file) return;
        const name = file.name.toLowerCase();

        // 1. Microsoft Excel Workbook (.xlsx, .xls, .ods)
        if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.ods')) {
          setIsProcessingBigData(true);
          setProgressStats({
            processedRows: 0,
            targetRows: 0,
            percent: 0,
            throughput: 0,
            elapsedMs: 0,
            statusText: `READING EXCEL WORKBOOK: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)...`
          });

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              const sheetName = workbook.SheetNames[0];
              const sheet = workbook.Sheets[sheetName];
              const jsonRows = window.XLSX.utils.sheet_to_json(sheet, { defval: '' });
              processParsedJsonRows(`${file.name} [Sheet: ${sheetName}]`, jsonRows);
            } catch (err) {
              setIsProcessingBigData(false);
              setProgressStats(null);
              alert('Excel reading error: ' + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
          return;
        }

        // 2. JSON Array File (.json)
        if (name.endsWith('.json')) {
          setIsProcessingBigData(true);
          setProgressStats({
            processedRows: 0,
            targetRows: 0,
            percent: 0,
            throughput: 0,
            elapsedMs: 0,
            statusText: `PARSING JSON DATASET: ${file.name}...`
          });

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              const rows = Array.isArray(parsed) ? parsed : [parsed];
              processParsedJsonRows(file.name, rows);
            } catch (err) {
              setIsProcessingBigData(false);
              setProgressStats(null);
              alert('JSON syntax error: ' + err.message);
            }
          };
          reader.readAsText(file);
          return;
        }

        // 3. Streaming CSV / TSV / TXT
        handleCsvFileStreaming(file);
      };

            for (let i = 1; i < lines.length; i++) {

              const obj = {};
              headers.forEach((h, idx) => { obj[h] = vals[idx] || ''; });
              rows.push(obj);
            }

          if (!rows.length) return;
          const headers = Object.keys(rows[0]);
          const columnsAnalysis = headers.map(col => {
            const values = rows.map(r => r[col]).filter(v => v !== undefined && v !== '');
            const isNumeric = values.every(v => !isNaN(Number(v)));
            const uniqueSet = new Set(values);

            let stats = '';
            let avg = 'N/A';
            let min = 'N/A';
            let max = 'N/A';
            const freq = {};
            values.forEach(v => { freq[v] = (freq[v] || 0) + 1; });

            if (isNumeric) {
              const nums = values.map(v => Number(v));
              const sum = nums.reduce((a, b) => a + b, 0);
              avg = (sum / nums.length).toFixed(1);
              max = Math.max(...nums);
              min = Math.min(...nums);
              stats = `Avg: ${avg} | Min: ${min} | Max: ${max}`;

              type: isNumeric ? 'Numerical (Float/Int)' : 'Categorical (String)',
              uniqueCount: uniqueSet.size,
              min: min,
              max: max,
              avg: avg,
              nullCount: 0,

  <!-- Interactive Cyber Constellation & Cursor Particle Physics Engine -->
  <script>
    const cursorGlow = document.getElementById('cursor-glow');
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursorGlow.style.left = `${e.clientX}px`;
      cursorGlow.style.top = `${e.clientY}px`;
    });

    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.size = Math.random() * 2 + 1;
        this.color = Math.random() > 0.4 ? '#00f0ff' : '#ff007f';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const force = (mouse.radius - distance) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            const alpha = (1 - dist / 110) * 0.22;
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }

        const mdx = particles[i].x - mouse.x;
        const mdy = particles[i].y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if (mdist < 140) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          const alpha = (1 - mdist / 140) * 0.45;
          ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
