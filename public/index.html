<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON // Cyber Defense & Data Analytics Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Orbitron & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #05070d;
      color: #e2e8f0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
        radial-gradient(circle at 100% 50%, rgba(255, 0, 128, 0.05), transparent 40%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .neon-cyan {
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6), 0 0 24px rgba(0, 240, 255, 0.3);
    }
    .neon-green {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }
    .neon-pink {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }
    .cyber-card {
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.03);
    }
    .cyber-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.06);
    }
    .cyber-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(255, 0, 127, 0.15));
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
    }
    .cyber-btn:hover {
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }
    #cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(255, 0, 127, 0.04) 50%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    #cyber-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #06080e; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <div id="cursor-glow"></div>
  <canvas id="cyber-canvas"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation state: 'analytics', 'cybersecurity', 'recon'
      const [currentView, setCurrentView] = useState('analytics');
      
      // 2FA Authenticator States
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [totpCode, setTotpCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [showSecretKey, setShowSecretKey] = useState(false);

      // OSINT Recon States
      const [target, setTarget] = useState('github.com');
      const [scanning, setScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('subdomains');
      const [dnsData, setDnsData] = useState(null);
      const [subdomainsData, setSubdomainsData] = useState(null);
      const [whoisData, setWhoisData] = useState(null);
      const [headersData, setHeadersData] = useState(null);
      const [searchFilter, setSearchFilter] = useState('');

      // Real-time telemetry state from backend
      const [realMetrics, setRealMetrics] = useState({
        totalRequests: 0,
        serverUptimeSeconds: 0,
        memory: { usedRssMb: '0', systemUsedPct: '0%', heapUsedMb: '0' },
        system: { platform: 'win32', nodeVersion: 'v24', cpuCores: 8, loadAvg: '0' },
        cachedKeysCount: 0,
        recentLogs: []
      });

      useEffect(() => {
        const savedToken = sessionStorage.getItem('axon_clearance_token');
        if (savedToken) {
          setIsUnlocked(true);
        }

        const fetchLiveMetrics = async () => {
          try {
            const res = await fetch('/api/analytics/realtime');
            const data = await res.json();
            if (data.realtime) {
              setRealMetrics(data);
            }
          } catch (e) {}
        };

        fetchLiveMetrics();
        const interval = setInterval(fetchLiveMetrics, 2000);
        return () => clearInterval(interval);
      }, []);

      const handleVerifyTOTP = async (e) => {
        e.preventDefault();
        setVerifying(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const res = await fetch('/api/auth/verify-2fa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: totpCode })
          });
          const data = await res.json();

          if (data.success) {
            setAuthSuccess(data.message);
            sessionStorage.setItem('axon_clearance_token', data.token);
            setTimeout(() => {
              setIsUnlocked(true);
              setShowAuthModal(false);
              setCurrentView('recon');
              runScan('github.com');
            }, 1000);
          } else {
            setAuthError(data.message || 'INVALID 2FA AUTHENTICATOR CODE');
          }
        } catch (err) {
          setAuthError('AUTHENTICATION SERVER ERROR');
        } finally {
          setVerifying(false);
        }
      };

      const lockTerminal = () => {
        sessionStorage.removeItem('axon_clearance_token');
        setIsUnlocked(false);
        setCurrentView('analytics');
      };

      const runScan = async (domainToScan) => {
        const domain = domainToScan || target;
        if (!domain) return;
        setScanning(true);

        try {
          const [dRes, sRes, wRes, hRes] = await Promise.allSettled([
            fetch(`/api/osint/dns?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/subdomains?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/whois?domain=${domain}`).then(r => r.json()),
            fetch(`/api/osint/headers?domain=${domain}`).then(r => r.json())
          ]);

          if (dRes.status === 'fulfilled') setDnsData(dRes.value);
          if (sRes.status === 'fulfilled') setSubdomainsData(sRes.value);
          if (wRes.status === 'fulfilled') setWhoisData(wRes.value);
          if (hRes.status === 'fulfilled') setHeadersData(hRes.value);
        } catch (e) {
          console.error(e);
        } finally {
          setScanning(false);
        }
      };

      return (
        <div class="max-w-7xl mx-auto px-4 py-6">
          {/* Top Bar / Navigation */}
          <header class="flex flex-col md:flex-row items-center justify-between pb-6 border-b border-cyan-500/20 gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-cyan-500/10 border border-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <span class="text-xl">🧬</span>
              </div>
              <div>
                <h1 class="text-2xl font-orbitron font-extrabold tracking-wider neon-cyan">
                  AXON // DATA ANALYTICS & CYBERSECURITY
                </h1>
                <p class="text-[11px] text-gray-400 font-mono flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  PRINCIPAL OPERATOR: ANSH // THREAT INTEL & DATA SCIENCE LAB
                </p>
              </div>
            </div>

            {/* Nav & 2FA Gate Button */}
            <div class="flex items-center gap-2">
              <button
                onClick={() => setCurrentView('analytics')}
                class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                  currentView === 'analytics'
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400 shadow-[0_0_12px_rgba(0,240,255,0.3)]'
                    : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                📊 DATA ANALYTICS
              </button>

              <button
                onClick={() => setCurrentView('cybersecurity')}
                class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                  currentView === 'cybersecurity'
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400 shadow-[0_0_12px_rgba(0,240,255,0.3)]'
                    : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                🛡️ CYBER DEFENSE
              </button>

              {isUnlocked ? (
                <div class="flex items-center gap-2">
                  <button
                    onClick={() => setCurrentView('recon')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-orbitron tracking-wider transition ${
                      currentView === 'recon'
                        ? 'bg-pink-500/20 text-pink-300 border border-pink-400 shadow-[0_0_12px_rgba(255,0,127,0.3)]'
                        : 'text-pink-400 hover:text-pink-300'
                    }`}
                  >
                    ⚡ RECON TERMINAL [UNLOCKED]
                  </button>
                  <button
                    onClick={lockTerminal}
                    title="Lock Restricted Terminal"
                    class="px-2.5 py-1.5 rounded-lg bg-rose-950/60 border border-rose-500/40 text-rose-400 text-xs hover:bg-rose-900 transition"
                  >
                    🔒 LOCK
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  class="cyber-btn px-4 py-1.5 rounded-lg text-xs font-orbitron font-bold text-cyan-300 tracking-wider flex items-center gap-1.5"
                >
                  <span>🔐</span>
                  RESTRICTED // 2FA RECON
                </button>
              )}
            </div>
          </header>

          {/* ======================================================== */}
          {/* VIEW 1: DATA ANALYTICS HUB */}
          {/* ======================================================== */}
          {currentView === 'analytics' && (
            <div class="mt-8 space-y-6">
              {/* Real Analytics Metrics Cards */}
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="cyber-card p-4 rounded-xl">
                  <span class="text-[10px] text-gray-500 font-orbitron block">TOTAL PROCESSED REQUESTS</span>
                  <h3 class="text-2xl font-orbitron font-bold text-cyan-400 mt-1">
                    {realMetrics.totalRequests}
                  </h3>
                  <span class="text-[10px] text-emerald-400">↑ Real-Time HTTP Counter</span>
                </div>

                <div class="cyber-card p-4 rounded-xl">
                  <span class="text-[10px] text-gray-500 font-orbitron block">SYSTEM MEMORY (RAM)</span>
                  <h3 class="text-2xl font-orbitron font-bold text-emerald-400 mt-1">
                    {realMetrics.memory?.systemUsedPct || '0%'}
                  </h3>
                  <span class="text-[10px] text-gray-400">Node RSS: {realMetrics.memory?.usedRssMb || '0'} MB</span>
                </div>

                <div class="cyber-card p-4 rounded-xl">
                  <span class="text-[10px] text-gray-500 font-orbitron block">SERVER UPTIME</span>
                  <h3 class="text-2xl font-orbitron font-bold text-pink-400 mt-1">
                    {Math.floor((realMetrics.serverUptimeSeconds || 0) / 60)}m {(realMetrics.serverUptimeSeconds || 0) % 60}s
                  </h3>
                  <span class="text-[10px] text-pink-400/80">Continuous Active Daemon</span>
                </div>

                <div class="cyber-card p-4 rounded-xl">
                  <span class="text-[10px] text-gray-500 font-orbitron block">RAM CACHED TARGETS</span>
                  <h3 class="text-2xl font-orbitron font-bold text-amber-400 mt-1">
                    {realMetrics.cachedKeysCount || 0} CACHED
                  </h3>
                  <span class="text-[10px] text-gray-400">Zero-Lag In-Memory DB</span>
                </div>
              </div>

              {/* Real Telemetry Architecture & Live Event Stream */}
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 cyber-card p-6 rounded-2xl">
                  <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-orbitron font-bold neon-cyan flex items-center gap-2">
                      <span>📈</span> LIVE INGESTED TRAFFIC & ACCESS LOGS
                    </h3>
                    <span class="text-[10px] text-emerald-400 px-2 py-0.5 bg-emerald-950/60 rounded border border-emerald-500/30 font-mono">
                      LIVE STREAM (AUTO-REFRESH 2S)
                    </span>
                  </div>

                  {/* Real Live Ingestion Table */}
                  <div class="overflow-x-auto max-h-[300px] overflow-y-auto">
                    <table class="w-full text-left font-mono text-xs">
                      <thead>
                        <tr class="border-b border-gray-800 text-gray-500 text-[10px] uppercase">
                          <th class="pb-2">Time</th>
                          <th class="pb-2">Method</th>
                          <th class="pb-2">Endpoint</th>
                          <th class="pb-2">Client IP</th>
                          <th class="pb-2">Status</th>
                          <th class="pb-2">Latency</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-gray-900/50">
                        {realMetrics.recentLogs && realMetrics.recentLogs.length > 0 ? (
                          realMetrics.recentLogs.map((log, idx) => (
                            <tr key={idx} class="hover:bg-slate-900/30 transition">
                              <td class="py-2 text-gray-400 text-[11px]">{log.timestamp}</td>
                              <td class="py-2 font-bold text-cyan-400">{log.method}</td>
                              <td class="py-2 text-gray-300 truncate max-w-[160px]">{log.path}</td>
                              <td class="py-2 text-gray-400 text-[11px]">{log.ip}</td>
                              <td class="py-2">
                                <span class={`px-1.5 py-0.5 rounded text-[10px] font-bold ${log.statusCode === 200 ? 'bg-emerald-950 text-emerald-400' : 'bg-rose-950 text-rose-400'}`}>
                                  {log.statusCode}
                                </span>
                              </td>
                              <td class="py-2 text-pink-400">{log.durationMs}ms</td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td colSpan="6" class="py-6 text-center text-gray-500">Listening for incoming live traffic...</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div class="mt-6 pt-4 border-t border-gray-800 grid grid-cols-3 gap-4 text-center">
                    <div>
                      <p class="text-[10px] text-gray-500">PLATFORM</p>
                      <p class="text-xs font-bold text-cyan-300 font-orbitron">{realMetrics.system?.platform || 'NODE'}</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-gray-500">CPU CORES</p>
                      <p class="text-xs font-bold text-emerald-300 font-orbitron">{realMetrics.system?.cpuCores || 4} CORES</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-gray-500">RUNTIME VERSION</p>
                      <p class="text-xs font-bold text-pink-300 font-orbitron">{realMetrics.system?.nodeVersion || 'v24'}</p>
                    </div>
                  </div>
                </div>

                {/* Analytical AI Models Showcase */}
                <div class="cyber-card p-6 rounded-2xl flex flex-col justify-between">
                  <div>
                    <h3 class="text-sm font-orbitron font-bold neon-pink mb-3 flex items-center gap-2">
                      <span>🤖</span> PREDICTIVE ML PIPELINES
                    </h3>
                    <p class="text-xs text-gray-400 leading-relaxed mb-4">
                      Leveraging Python data analytics and mathematical classification to uncover attack surface anomalies before exploitation.
                    </p>

                    <div class="space-y-2 text-xs font-mono">
                      <div class="p-2.5 bg-black/40 border border-gray-800 rounded-lg flex justify-between">
                        <span class="text-gray-300">Feature Engineering</span>
                        <span class="text-cyan-400 font-bold">128 Vectors</span>
                      </div>
                      <div class="p-2.5 bg-black/40 border border-gray-800 rounded-lg flex justify-between">
                        <span class="text-gray-300">Clustering Algorithm</span>
                        <span class="text-emerald-400 font-bold">DBSCAN / K-Means</span>
                      </div>
                      <div class="p-2.5 bg-black/40 border border-gray-800 rounded-lg flex justify-between">
                        <span class="text-gray-300">Entropy Analysis</span>
                        <span class="text-pink-400 font-bold">Shannon Entropy</span>
                      </div>
                    </div>
                  </div>

                  <div class="mt-4 p-3 bg-cyan-950/20 border border-cyan-500/20 rounded-xl">
                    <span class="text-[10px] text-cyan-400 font-bold block">OPERATOR STATEMENT:</span>
                    <p class="text-[11px] text-gray-400 mt-1 italic">
                      "Data without intelligence is noise. We transform millions of network packets into actionable threat models."
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* VIEW 2: CYBER DEFENSE SUITE */}
          {/* ======================================================== */}
          {currentView === 'cybersecurity' && (
            <div class="mt-8 space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="cyber-card p-6 rounded-2xl">
                  <div class="text-2xl mb-2">🛡️</div>
                  <h3 class="text-base font-orbitron font-bold neon-cyan mb-2">VULNERABILITY RESEARCH</h3>
                  <p class="text-xs text-gray-400 leading-relaxed">
                    Automated passive inspection against OWASP Top 10 vectors: Injection, Broken Auth, Security Misconfigurations, and Missing Hardening Headers.
                  </p>
                </div>

                <div class="cyber-card p-6 rounded-2xl">
                  <div class="text-2xl mb-2">🌐</div>
                  <h3 class="text-base font-orbitron font-bold neon-green mb-2">ATTACK SURFACE MAPPING</h3>
                  <p class="text-xs text-gray-400 leading-relaxed">
                    Zero-touch passive reconnaissance enumerating exposed subdomains, legacy DNS zone entries, and forgotten public staging servers.
                  </p>
                </div>

                <div class="cyber-card p-6 rounded-2xl">
                  <div class="text-2xl mb-2">📜</div>
                  <h3 class="text-base font-orbitron font-bold neon-pink mb-2">IDENTITY & CERTIFICATE INTEL</h3>
                  <p class="text-xs text-gray-400 leading-relaxed">
                    Monitoring Certificate Transparency (CT) logs and Public RDAP registries for domain expiration dates, typosquatting, and phishing defense.
                  </p>
                </div>
              </div>

              {/* Framework compliance card */}
              <div class="cyber-card p-6 rounded-2xl">
                <h3 class="text-sm font-orbitron font-bold neon-cyan mb-4">CYBERSECURITY FRAMEWORKS & STACK</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs font-mono">
                  <div class="p-3 bg-black/50 border border-gray-800 rounded-xl">
                    <span class="text-gray-500 block text-[10px]">RECON PROTOCOL</span>
                    <span class="text-cyan-300 font-bold">PASSIVE OSINT</span>
                  </div>
                  <div class="p-3 bg-black/50 border border-gray-800 rounded-xl">
                    <span class="text-gray-500 block text-[10px]">AUTHENTICATION</span>
                    <span class="text-emerald-300 font-bold">RFC 6238 TOTP 2FA</span>
                  </div>
                  <div class="p-3 bg-black/50 border border-gray-800 rounded-xl">
                    <span class="text-gray-500 block text-[10px]">ENGINE RUNTIME</span>
                    <span class="text-pink-300 font-bold">NODE.JS // ASYNC I/O</span>
                  </div>
                  <div class="p-3 bg-black/50 border border-gray-800 rounded-xl">
                    <span class="text-gray-500 block text-[10px]">DEFENSE STANDARD</span>
                    <span class="text-amber-300 font-bold">ZERO-TRUST AUDIT</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* VIEW 3: RESTRICTED OSINT RECON TERMINAL (PROTECTED BY 2FA) */}
          {/* ======================================================== */}
          {currentView === 'recon' && isUnlocked && (
            <div class="mt-8 space-y-6">
              {/* Target Input HUD */}
              <div class="cyber-card p-4 md:p-6 rounded-2xl border-pink-500/30">
                <form onSubmit={(e) => { e.preventDefault(); runScan(); }} class="flex flex-col md:flex-row gap-3">
                  <div class="relative flex-1">
                    <span class="absolute left-4 top-3.5 text-pink-400 font-mono text-sm">TARGET_DOMAIN &gt;</span>
                    <input
                      type="text"
                      value={target}
                      onChange={(e) => setTarget(e.target.value)}
                      placeholder="e.g. netflix.com, github.com, tesla.com"
                      class="w-full pl-44 pr-4 py-3 bg-black/60 border border-pink-500/40 rounded-xl text-pink-300 font-mono focus:outline-none focus:border-pink-400 focus:shadow-[0_0_20px_rgba(255,0,127,0.3)] transition"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={scanning}
                    class="cyber-btn px-8 py-3 rounded-xl font-orbitron font-bold text-sm text-cyan-300 tracking-wider flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                  >
                    {scanning ? (
                      <>
                        <span class="inline-block animate-spin text-lg">⚙️</span>
                        SCANNING HUD...
                      </>
                    ) : (
                      <>
                        <span>🔍</span>
                        INITIALIZE RECON
                      </>
                    )}
                  </button>
                </form>

                <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">
                  <span class="text-gray-500 uppercase tracking-widest text-[10px]">Quick Recon Targets:</span>
                  {['github.com', 'netflix.com', 'google.com', 'tesla.com', 'openai.com'].map(d => (
                    <button
                      key={d}
                      onClick={() => { setTarget(d); runScan(d); }}
                      class="px-2.5 py-1 bg-cyan-950/40 border border-cyan-500/30 rounded-md text-cyan-400 hover:bg-cyan-500 hover:text-black transition text-[11px]"
                    >
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              {/* Metric Stats Cards */}
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="cyber-card p-4 rounded-xl">
                  <p class="text-[11px] text-gray-400 font-orbitron">DISCOVERED SUBDOMAINS</p>
                  <h3 class="text-2xl font-orbitron font-bold text-cyan-400 mt-1">
                    {subdomainsData ? subdomainsData.count : '--'}
                  </h3>
                  <p class="text-[10px] text-cyan-500/70 mt-1">Host mapping via public feeds</p>
                </div>

                <div class="cyber-card p-4 rounded-xl">
                  <p class="text-[11px] text-gray-400 font-orbitron">MAIL SECURITY (SPOOFING)</p>
                  <h3 class="text-lg font-orbitron font-bold mt-2">
                    {dnsData?.mailSecurity ? (

  <!-- Interactive Cyber Constellation & Cursor Particle Physics Engine -->
  <script>
    const cursorGlow = document.getElementById('cursor-glow');
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursorGlow.style.left = `${e.clientX}px`;
      cursorGlow.style.top = `${e.clientY}px`;
    });

    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.size = Math.random() * 2 + 1;
        this.color = Math.random() > 0.4 ? '#00f0ff' : '#ff007f';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const force = (mouse.radius - distance) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            const alpha = (1 - dist / 110) * 0.22;
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }

        const mdx = particles[i].x - mouse.x;
        const mdy = particles[i].y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if (mdist < 140) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          const alpha = (1 - mdist / 140) * 0.45;
          ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
